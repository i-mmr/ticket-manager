services:
  # 本番の入口。Nginx が HTTP/HTTPS を受け、HTTP は HTTPS へリダイレクトする。
  web:
    build:
      context: ./src
      dockerfile: Dockerfile.production
      target: web
    # Nginx 設定は src/docker/nginx/default.conf.template から生成する。
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped

  # Let's Encrypt 証明書の発行・更新用。通常は必要なタイミングで run して使う。
  certbot:
    image: certbot/certbot:v2.11.0
    profiles:
      - certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${LETSENCRYPT_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN}

  # 本番の Laravel 実行環境。開発用の php artisan serve は使わず PHP-FPM で動かす。
  app:
    build:
      context: ./src
      dockerfile: Dockerfile.production
      target: app
    env_file:
      - path: ./src/.env.production
        required: false
    environment:
      # 本番では .env.production を基本にしつつ、DB/Redis 接続先は Compose 側で統一する。
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE:-ticket_manager}
      DB_USERNAME: ${MYSQL_USER:-ticket_manager}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      REDIS_HOST: redis
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # 本番 DB は VPS の localhost にだけ公開し、外部からは SSH トンネル経由で接続する。
  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ticket_manager}
      MYSQL_USER: ${MYSQL_USER:-ticket_manager}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    volumes:
      - prod-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 本番のセッション、キュー、キャッシュ用。データは volume に永続化する。
  redis:
    image: redis:8-alpine
    volumes:
      - prod-redis-data:/data
    restart: unless-stopped

volumes:
  app-storage:
  letsencrypt:
  certbot-www:
  prod-db-data:
  prod-redis-data:
