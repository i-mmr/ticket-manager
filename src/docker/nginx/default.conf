server {
    listen 80;
    server_name _;

    # Laravel は public ディレクトリだけを Web 公開する。
    root /var/www/html/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # 静的ファイルがなければ Laravel のフロントコントローラへ渡す。
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    # PHP は Nginx コンテナ内では実行せず、app サービスの PHP-FPM に渡す。
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
    }

    # .env などの隠しファイルは公開しない。
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
