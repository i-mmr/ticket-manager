services:
  # 開発用構成。app コンテナひとつで Laravel と Vite を起動し、ソースは bind mount で即時反映する。
  app:
    build:
      context: ./src
      dockerfile: Dockerfile
    working_dir: /var/www/html
    user: "${UID}:${GID}"
    volumes:
      - ./src:/var/www/html
    ports:
      - "8000:8000"
      - "5173:5173"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh docker/dev-start.sh

  # 開発では DB をホストにも公開し、GUI クライアントなどから接続しやすくする。
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laravel}
      MYSQL_USER: ${MYSQL_USER:-laravel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # セッション、キュー、キャッシュの動作確認用。開発・本番どちらも Redis を使う。
  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
